name: CI

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main", "release/*" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests-and-coverage:
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Build
      run: swift build
    - name: Test
      run: swift test --enable-code-coverage
    - name: Setup llvm-cov
      run: sudo ln -s $(xcrun --find llvm-cov) /usr/local/bin/llvm-cov
    - name: Generate LCOV
      uses: maxep/spm-lcov-action@765d4ca99e04bd445addad335a670ee64c12661b # v0.3.0
      with:
        output-file: ./lcov.info
    - name: Upload Coverage Artifact (Base)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-base
        path: ./lcov.info
    - name: Download Base Coverage
      if: github.event_name == 'pull_request'
      uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe # v3.1.4
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: ci.yml
        branch: ${{ github.base_ref }}
        name: coverage-base
        path: ./base-coverage/
    - name: Report Coverage to PR
      uses: Nef10/lcov-reporter-action@797ec1c1e78e3a9a7890c1a104d58b9e05fcef76 # v0.6.1
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr-number: ${{ github.event.pull_request.number }}
        lcov-file: ./lcov.info
        lcov-base: ./base-coverage/lcov.info
        filter-changed-files: true
        delete-old-comments: true

  ios-integration-tests:
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    # Run Example App Tests (Integration via xcodebuild)
    # Using iPhone 17 on macos-26 (available on the latest simulator runtime)
    - name: Run Example App Tests
      run: |
        xcodebuild test \
          -project Example/HarborExample.xcodeproj \
          -scheme HarborExample \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -resultBundlePath TestResults \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
