name: CI

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main", "release/*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests-and-coverage:
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - name: Build
      run: swift build
    - name: Test
      run: swift test --enable-code-coverage
    - name: Setup llvm-cov
      run: sudo ln -s $(xcrun --find llvm-cov) /usr/local/bin/llvm-cov
    - name: Generate LCOV
      uses: maxep/spm-lcov-action@765d4ca99e04bd445addad335a670ee64c12661b # v0.3.0
      with:
        output-file: ./lcov.info
    - name: Upload Coverage Artifact (Base)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-base
        path: ./lcov.info
    - name: Download Base Coverage
      if: github.event_name == 'pull_request'
      uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe # v3.1.4
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: ci.yml
        branch: ${{ github.base_ref }}
        name: coverage-base
        path: ./base-coverage/
    - name: Generate Coverage Report
      if: github.event_name == 'pull_request'
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: python3 scripts/generate_coverage_report.py ./lcov.info ./base-coverage/lcov.info ./coverage_comment.md

    - name: Post Coverage Comment to PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync('./coverage_comment.md')) return;
          const body = fs.readFileSync('./coverage_comment.md', 'utf8');
          const issue_number = context.payload.pull_request.number;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
          });

          const botComment = comments.data.find(c =>
            c.user && c.user.login === 'github-actions[bot]' &&
            (c.body.includes('Coverage Report') || c.body.includes('Line Coverage Report'))
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: botComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

  ios-integration-tests:
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    # Run Example App Tests (Integration via xcodebuild)
    # Using iPhone 17 on macos-26 (available on the latest simulator runtime)
    - name: Run Example App Tests
      run: |
        xcodebuild test \
          -project Example/HarborExample.xcodeproj \
          -scheme HarborExample \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -resultBundlePath TestResults \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
