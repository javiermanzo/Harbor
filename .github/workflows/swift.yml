# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: UnitTests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "release/*" ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 16.1
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    # 1. Run Package Tests (Library Logic)
    - name: Run Package Tests
      run: swift test -v --enable-code-coverage

    # 2. Run Example App Tests (Integration via xcodebuild)
    # Note: Requires 'HarborExample' scheme to be marked as 'Shared' in Xcode
    - name: Run Example App Tests
      run: |
        xcodebuild test \
          -project Example/HarborExample.xcodeproj \
          -scheme HarborExample \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
          -resultBundlePath TestResults \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
